name: 영상 찾아받기 APK 만들기

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v3

      - name: 서명키 준비
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "::error::SIGNING_KEY_B64 비밀값이 없어요. 안내문 2번을 확인하세요."; exit 1
          fi
          echo "$SIGNING_KEY_B64" | base64 -d > app/ytget.jks
          printf 'storeFile=ytget.jks\nstorePassword=ytget1234\nkeyAlias=ytget\nkeyPassword=ytget1234\n' > keystore.properties

      - name: JS 엔진(QuickJS) 만들기
        run: |
          set -euo pipefail
          STAGE="start"
          trap 'echo "::error::QuickJS 실패 단계=$STAGE"' ERR
          STAGE="ndk-find"
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi
          echo "::notice::NDK=$NDK"
          [ -f "$NDK/build/cmake/android.toolchain.cmake" ]
          STAGE="tag"
          TAG=$(git ls-remote --tags --refs https://github.com/quickjs-ng/quickjs.git | sed 's#.*/##' | grep -E '^v[0-9]+[.][0-9]+[.][0-9]+$' | sort -V | tail -1 || true)
          echo "::notice::QuickJS-ng TAG=$TAG"
          STAGE="clone"
          if [ -n "$TAG" ]; then
            git clone -q --depth 1 --branch "$TAG" https://github.com/quickjs-ng/quickjs.git /tmp/qjs
          else
            git clone -q --depth 1 https://github.com/quickjs-ng/quickjs.git /tmp/qjs
          fi
          STAGE="cmake-config"
          cmake -S /tmp/qjs -B /tmp/qjs/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF > /tmp/qjs-config.log 2>&1 || { tail -20 /tmp/qjs-config.log | sed 's/^/::error::/'; false; }
          STAGE="cmake-build"
          cmake --build /tmp/qjs/build -j4 > /tmp/qjs-build.log 2>&1 || { grep -m5 -E "error|Error" /tmp/qjs-build.log | sed 's/^/::error::/'; false; }
          STAGE="copy"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          QJS=$(find /tmp/qjs/build -type f \( -name qjs -o -name 'qjs-*' \) ! -name '*.o' ! -name '*.a' ! -name '*.cmake' -perm -u+x | head -1 || true)
          if [ -z "$QJS" ]; then
            echo "::error::큰 파일: $(find /tmp/qjs/build -type f -size +200k | head -12 | tr '\n' ' ')"
            echo "::error::빌드 끝부분: $(tail -5 /tmp/qjs-build.log | tr '\n' ' ' | cut -c1-600)"
            echo "::error::설정 옵션: $(grep -E '^(option|xoption)\(' /tmp/qjs/CMakeLists.txt | tr '\n' ' ' | cut -c1-900)"
          fi
          cp "$QJS" app/src/main/jniLibs/arm64-v8a/libqjs.so
          echo "::notice::$(file app/src/main/jniLibs/arm64-v8a/libqjs.so) $(stat -c%s app/src/main/jniLibs/arm64-v8a/libqjs.so) bytes"

      - name: 빌드
        run: |
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          ./gradlew assembleGenericRelease --no-parallel --stacktrace

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ytget-apk
          path: app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 바로 받기 주소에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/**/*arm64-v8a*.apk 2>/dev/null | head -1 || true)
          [ -z "$APK" ] && APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk' | head -1)
          cp "$APK" YeongsangChajaBatgi.apk
          gh release delete app-latest -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create app-latest YeongsangChajaBatgi.apk -R "$GITHUB_REPOSITORY" \
            --title "영상 찾아받기 최신판" \
            --notes "빌드 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') (한국 시간)" --target "$GITHUB_SHA"
          echo "::notice::바로 받기: https://github.com/$GITHUB_REPOSITORY/releases/download/app-latest/YeongsangChajaBatgi.apk"
