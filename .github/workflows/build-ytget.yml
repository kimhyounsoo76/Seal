name: 영상 찾아받기 APK 만들기

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v3

      - name: 서명키 준비
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "::error::SIGNING_KEY_B64 비밀값이 없어요. 안내문 2번을 확인하세요."; exit 1
          fi
          echo "$SIGNING_KEY_B64" | base64 -d > app/ytget.jks
          printf 'storeFile=ytget.jks\nstorePassword=ytget1234\nkeyAlias=ytget\nkeyPassword=ytget1234\n' > keystore.properties

      - name: JS 엔진(QuickJS) 만들기
        run: |
          set -e
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)
          [ -z "$NDK" ] && NDK="$ANDROID_NDK_HOME"
          echo "NDK=$NDK"
          TAG=$(git ls-remote --tags --refs https://github.com/quickjs-ng/quickjs.git | sed 's#.*/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "QuickJS-ng $TAG"
          git clone -q --depth 1 --branch "$TAG" https://github.com/quickjs-ng/quickjs.git /tmp/qjs
          cmake -S /tmp/qjs -B /tmp/qjs/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/qjs/build --target qjs -j4
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp /tmp/qjs/build/qjs app/src/main/jniLibs/arm64-v8a/libqjs.so
          file app/src/main/jniLibs/arm64-v8a/libqjs.so || true
          ls -l app/src/main/jniLibs/arm64-v8a/

      - name: 빌드
        run: |
          chmod +x gradlew
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          ./gradlew assembleGenericRelease --no-parallel --stacktrace

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ytget-apk
          path: app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30
