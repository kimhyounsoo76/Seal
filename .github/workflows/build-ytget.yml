name: 영상 찾아받기 APK 만들기

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: 서명키 준비
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -z "$SIGNING_KEY_B64" ]; then
            echo "::error::SIGNING_KEY_B64 비밀값이 없어요. 안내문 2번을 확인하세요."; exit 1
          fi
          echo "$SIGNING_KEY_B64" | base64 -d > app/ytget.jks
          printf 'storeFile=ytget.jks\nstorePassword=ytget1234\nkeyAlias=ytget\nkeyPassword=ytget1234\n' > keystore.properties

      - name: 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: ytget-apk
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30
